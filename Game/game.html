<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factory Sandbox</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#0f172a;
font-family:Arial,sans-serif;
color:white;
}

canvas{
display:block;
image-rendering:pixelated;
background:#111827;
touch-action:none;
}

#ui{
position:fixed;
top:10px;
left:10px;
width:320px;
background:#000000bb;
padding:14px;
border-radius:18px;
z-index:10;
backdrop-filter:blur(5px);
}

#toolbar{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:10px;
}

button{
padding:8px 10px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#3b82f6;
}

#stats{
margin-top:10px;
line-height:1.5;
font-size:14px;
}

</style>
</head>
<body>

<div id="ui">

<h2>🏭 Factory Sandbox</h2>

<div id="toolbar">
<button onclick="setBuild('belt')">Belt</button>
<button onclick="setBuild('miner')">Miner</button>
<button onclick="setBuild('turret')">Turret</button>
<button onclick="setBuild('wall')">Wall</button>
<button onclick="setBuild('generator')">Generator</button>
</div>

<div id="stats"></div>

<p style="margin-top:10px;font-size:13px">
WASD — камера<br>
ЛКМ — будувати<br>
ПКМ — видалити
</p>

</div>

<canvas id="game"></canvas>

<script>

// ========================================
// CONFIG
// ========================================

const TILE = 32
const SCALE = 2

const MAP_W = 160
const MAP_H = 160

// ========================================
// CANVAS
// ========================================

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

ctx.imageSmoothingEnabled = false

function resize(){
canvas.width = window.innerWidth
canvas.height = window.innerHeight
}

resize()

window.addEventListener("resize",resize)

// ========================================
// SPRITES
// ========================================

const sprites = {}

const spriteFiles = {

grass:"sprites/grass.png",
iron:"sprites/iron.png",

core:"sprites/core.png",
enemy:"sprites/enemy.png",
enemyBase:"sprites/enemy_base.png",

belt:"sprites/belt.png",
miner:"sprites/miner.png",
turret:"sprites/turret.png",
wall:"sprites/wall.png",
generator:"sprites/generator.png",

bullet:"sprites/bullet.png"

}

function loadSprites(){

for(const key in spriteFiles){

const img = new Image()

img.src = spriteFiles[key]

img.onerror = ()=>{
console.warn("Missing sprite:",spriteFiles[key])
}

sprites[key] = img

}

}

loadSprites()

// ========================================
// WORLD
// ========================================

const world = []

function noise(x,y){
return Math.abs(Math.sin(x*17.12+y*91.17)*9999)%1
}

for(let y=0;y<MAP_H;y++){

world[y] = []

for(let x=0;x<MAP_W;x++){

let ore = null

if(noise(x,y) > 0.83){
ore = "iron"
}

world[y][x] = {
ore,
building:null
}

}

}

// ========================================
// CORE
// ========================================

const core = {
x:Math.floor(MAP_W/2),
y:Math.floor(MAP_H/2),
hp:1000
}

// ========================================
// ENEMY BASE
// ========================================

const enemyBase = {
x:8,
y:8
}

// ========================================
// CAMERA
// ========================================

let cameraX = core.x*TILE - canvas.width/4
let cameraY = core.y*TILE - canvas.height/4

const keys = {}

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()] = true
})

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()] = false
})

function updateCamera(){

const speed = 12

if(keys["w"]) cameraY -= speed
if(keys["s"]) cameraY += speed
if(keys["a"]) cameraX -= speed
if(keys["d"]) cameraX += speed

}

// ========================================
// BUILD SYSTEM
// ========================================

let buildMode = "belt"

function setBuild(type){
buildMode = type
}

function createBuilding(type,x,y){

return {
kind:type,
x,
y,
hp:100,
reload:0,
progress:0
}

}

canvas.addEventListener("contextmenu",e=>e.preventDefault())

canvas.addEventListener("mousedown",handleBuild)

function handleBuild(e){

const tx = Math.floor((e.clientX/SCALE + cameraX)/TILE)
const ty = Math.floor((e.clientY/SCALE + cameraY)/TILE)

if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return

if(e.button===2){

world[ty][tx].building = null
return

}

if(world[ty][tx].building)return

world[ty][tx].building = createBuilding(buildMode,tx,ty)

}

// ========================================
// ENTITIES
// ========================================

const enemies = []
const bullets = []
const items = []

// ========================================
// RESOURCES
// ========================================

const resources = {
iron:200,
power:100
}

// ========================================
// WAVES
// ========================================

let wave = 1

function spawnWave(){

for(let i=0;i<wave*4;i++){

enemies.push({

x:enemyBase.x,
y:enemyBase.y,

hp:60,

path:[],
moveTimer:0,
attackTimer:0

})

}

wave++

}

// ========================================
// PATHFINDING
// ========================================

function findPath(startX,startY,endX,endY){

const queue = []
const visited = {}

queue.push({
x:startX,
y:startY,
path:[]
})

visited[startX+","+startY] = true

const dirs = [
[1,0],
[-1,0],
[0,1],
[0,-1]
]

while(queue.length){

const current = queue.shift()

if(current.x===endX && current.y===endY){
return current.path
}

for(const dir of dirs){

const nx = current.x + dir[0]
const ny = current.y + dir[1]

if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H)continue

const key = nx+","+ny

if(visited[key])continue

const tile = world[ny][nx]

if(tile.building && tile.building.kind==="wall"){
continue
}

visited[key] = true

queue.push({
x:nx,
y:ny,
path:[...current.path,{x:nx,y:ny}]
})

}

}

return []

}

// ========================================
// ENEMIES
// ========================================

function updateEnemies(){

for(const enemy of enemies){

enemy.moveTimer++

if(enemy.path.length===0){
enemy.path = findPath(enemy.x,enemy.y,core.x,core.y)
}

if(enemy.moveTimer > 20){

enemy.moveTimer = 0

if(enemy.path.length){

const next = enemy.path.shift()

enemy.x = next.x
enemy.y = next.y

}

}

const tile = world[enemy.y]?.[enemy.x]

if(tile?.building){

enemy.attackTimer++

if(enemy.attackTimer > 30){

tile.building.hp -= 10
enemy.attackTimer = 0

if(tile.building.hp <= 0){

tile.building = null
enemy.path = []

}

}

}

if(enemy.x===core.x && enemy.y===core.y){
core.hp -= 0.1
}

}

for(let i=enemies.length-1;i>=0;i--){

if(enemies[i].hp<=0){
enemies.splice(i,1)
}

}

}

// ========================================
// BUILDINGS
// ========================================

function updateBuildings(){

for(let y=0;y<MAP_H;y++){
for(let x=0;x<MAP_W;x++){

const tile = world[y][x]
const b = tile.building

if(!b)continue

if(b.kind==="miner"){

b.progress++

if(tile.ore==="iron" && b.progress>120){

items.push({
x:x,
y:y,
type:"iron"
})

b.progress = 0

}

}

if(b.kind==="generator"){
resources.power += 0.03
}

if(b.kind==="turret"){

b.reload--

let target = null
let dist = 9999

for(const enemy of enemies){

const d =
Math.abs(enemy.x-x)+
Math.abs(enemy.y-y)

if(d<8 && d<dist){

dist = d
target = enemy

}

}

if(target && b.reload<=0){

bullets.push({

x:x+0.5,
y:y+0.5,
target

})

b.reload = 40

}

}

}
}

}

// ========================================
// BULLETS
// ========================================

function updateBullets(){

for(const bullet of bullets){

const dx = bullet.target.x+0.5 - bullet.x
const dy = bullet.target.y+0.5 - bullet.y

const dist = Math.hypot(dx,dy)

bullet.x += dx/dist * 0.2
bullet.y += dy/dist * 0.2

if(dist<0.3){

bullet.target.hp -= 25
bullet.dead = true

}

}

for(let i=bullets.length-1;i>=0;i--){

if(bullets[i].dead){
bullets.splice(i,1)
}

}

}

// ========================================
// ITEMS
// ========================================

function updateItems(){

for(const item of items){

const tile = world[item.y]?.[item.x]

if(tile?.building?.kind==="belt"){
item.x += 0.02
}

if(Math.floor(item.x)===core.x &&
Math.floor(item.y)===core.y){

resources.iron++
item.dead = true

}

}

for(let i=items.length-1;i>=0;i--){

if(items[i].dead){
items.splice(i,1)
}

}

}

// ========================================
// DRAW
// ========================================

function drawSprite(name,worldX,worldY){

const img = sprites[name]

const screenX = (worldX - cameraX) * SCALE
const screenY = (worldY - cameraY) * SCALE

const size = TILE * SCALE

if(img && img.complete){

ctx.drawImage(
img,
screenX,
screenY,
size,
size
)

}else{

ctx.fillStyle = "magenta"

ctx.fillRect(
screenX,
screenY,
size,
size
)

}

}

function drawMap(){

const startX = Math.floor(cameraX/TILE)
const startY = Math.floor(cameraY/TILE)

const endX =
startX +
Math.ceil(canvas.width/(TILE*SCALE))+2

const endY =
startY +
Math.ceil(canvas.height/(TILE*SCALE))+2

for(let y=startY;y<endY;y++){
for(let x=startX;x<endX;x++){

if(x<0||y<0||x>=MAP_W||y>=MAP_H)continue

const worldX = x*TILE
const worldY = y*TILE

const tile = world[y][x]

drawSprite("grass",worldX,worldY)

if(tile.ore==="iron"){
drawSprite("iron",worldX,worldY)
}

if(tile.building){
drawSprite(
tile.building.kind,
worldX,
worldY
)
}

}
}

}

function drawCore(){

drawSprite(
"core",
core.x*TILE,
core.y*TILE
)

}

function drawEnemyBase(){

drawSprite(
"enemyBase",
enemyBase.x*TILE,
enemyBase.y*TILE
)

}

function drawEnemies(){

for(const enemy of enemies){

drawSprite(
"enemy",
enemy.x*TILE,
enemy.y*TILE
)

}

}

function drawBullets(){

for(const bullet of bullets){

drawSprite(
"bullet",
bullet.x*TILE,
bullet.y*TILE
)

}

}

function drawItems(){

ctx.fillStyle = "white"

for(const item of items){

const sx =
(item.x*TILE - cameraX) * SCALE

const sy =
(item.y*TILE - cameraY) * SCALE

ctx.fillRect(sx+10,sy+10,8,8)

}

}

function drawFog(){

ctx.fillStyle = "rgba(0,0,0,0.2)"
ctx.fillRect(0,0,canvas.width,canvas.height)

}

// ========================================
// UI
// ========================================

function updateUI(){

document.getElementById("stats").innerHTML = `
⚙ Build: ${buildMode}<br>
⛏ Iron: ${Math.floor(resources.iron)}<br>
⚡ Power: ${Math.floor(resources.power)}<br>
❤️ Core HP: ${Math.floor(core.hp)}<br>
👾 Enemies: ${enemies.length}<br>
🌊 Wave: ${wave}<br>
`

}

// ========================================
// LOOP
// ========================================

let tick = 0

function loop(){

ctx.clearRect(0,0,canvas.width,canvas.height)

updateCamera()

updateEnemies()
updateBuildings()
updateBullets()
updateItems()

if(tick % 900 === 0){
spawnWave()
}

drawMap()
drawCore()
drawEnemyBase()
drawEnemies()
drawBullets()
drawItems()
drawFog()

updateUI()

if(core.hp<=0){

alert("Game Over")
location.reload()

}

requestAnimationFrame(loop)

tick++

}

spawnWave()
loop()

</script>

</body>
</html>
